name: Profile cards

# Redraws the achievements panel and the legendary item card once a day,
# then stitches all cards into one window.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - ".github/scripts/streak_card.py"
      - ".github/scripts/item_card.py"
      - ".github/scripts/wow_static.py"
      - ".github/scripts/compose.py"
      - ".github/scripts/battle_card.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Draw achievements panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/streak_card.py
      - name: Draw legendary item card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 .github/scripts/item_card.py
      - name: Stitch cards into one window
        run: |
          python3 .github/scripts/wow_static.py
          python3 .github/scripts/battle_card.py
          python3 .github/scripts/compose.py
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update profile cards"; then
            git push
          fi
