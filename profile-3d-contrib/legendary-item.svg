    <text x="804" y="148" text-anchor="end" fill="#ffffff">Python</text>
    <text x="168" y="352" fill="#ffffff">Sell Price: <tspan fill="#ffd100">hire me</tspan> <tspan fill="#ffd100" font-size="11">⬤</tspan></text>
    <text x="804" y="352" text-anchor="end" fill="#9d9d9d" font-size="13">Durability 84 / 84</text>
  </g>
