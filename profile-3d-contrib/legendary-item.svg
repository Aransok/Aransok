<svg viewBox="0 0 840 380" width="840" height="380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doan Idriz, Forger of Agents: legendary item tooltip, item level 2092">
  <title>Doan Idriz, Forger of Agents</title>
  <style>
    .w{font-family:"Friz Quadrata TT","Friz Quadrata",Verdana,"Segoe UI",system-ui,sans-serif}
    .aura{animation:aura 2.4s ease-in-out infinite}
    @keyframes aura{50%{opacity:.35}}
    .edge{animation:edge 3s ease-in-out infinite}
    @keyframes edge{50%{stroke:#fde68a;stroke-opacity:1}}
    @media (prefers-reduced-motion:reduce){.aura,.edge{animation:none}}
  </style>
  <defs>
    <radialGradient id="icon" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fdba74"/><stop offset=".45" stop-color="#ea580c"/><stop offset="1" stop-color="#431407"/></radialGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1225"/><stop offset="1" stop-color="#050913"/></linearGradient>
  </defs>

  <rect class="aura" x="10" y="10" width="112" height="112" rx="10" fill="none" stroke="#ff8000" stroke-width="3"/>
  <rect x="16" y="16" width="100" height="100" rx="6" fill="url(#icon)" stroke="#a3a3a3" stroke-width="3"/>
  <text x="66" y="84" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="44" font-weight="700" fill="#fff7ed">{ }</text>

  <rect class="edge" x="140" y="10" width="690" height="360" rx="8" fill="url(#tip)" fill-opacity=".96" stroke="#9ca3af" stroke-opacity=".7" stroke-width="2"/>
  <g class="w" font-size="15">
    <text x="168" y="46" font-size="23" font-weight="700" fill="#ff8000">Doan Idriz, Forger of Agents</text>
    <text x="168" y="78" fill="#ffd100">Item Level 2,092</text>
    <text x="168" y="100" fill="#ffffff">Binds when hired</text>
    <text x="168" y="122" fill="#ffffff">Unique-Equipped</text>
    <text x="168" y="172" fill="#ffffff">+95 Python</text>
    <text x="168" y="194" fill="#ffffff">+88 Retrieval (Pinecone)</text>
    <text x="168" y="216" fill="#ffffff">+85 Django</text>
    <text x="168" y="246" fill="#1eff00">Equip: Builds AI agents and RAG pipelines from scratch.</text>
    <text x="168" y="268" fill="#1eff00">No LangChain. No CrewAI. Pure Python.</text>
    <text x="168" y="292" fill="#1eff00">Use: Ships to production. broffice.bg is live. (1 day cooldown)</text>
    <text x="168" y="322" fill="#ffd100" font-style="italic">“Forged in Plovdiv, the city of seven hills.”</text>
